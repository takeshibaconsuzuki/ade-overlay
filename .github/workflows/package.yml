name: Package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      CSC_LINK: ${{ startsWith(matrix.os, 'windows') && secrets.WINDOWS_CSC_LINK || (startsWith(matrix.os, 'macos') && secrets.MAC_CSC_LINK || '') }}
      CSC_KEY_PASSWORD: ${{ startsWith(matrix.os, 'windows') && secrets.WINDOWS_CSC_KEY_PASSWORD || (startsWith(matrix.os, 'macos') && secrets.MAC_CSC_KEY_PASSWORD || '') }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ADE_REQUIRE_SIGNING: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools xvfb libgbm1 libasound2
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run package
      - name: Test on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm test
      - name: Test on desktop runners
        if: runner.os != 'Linux'
        run: npm test
      - name: Check approved VS Code runtime on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:runtime
      - name: Check approved VS Code runtime on desktop runners
        if: runner.os != 'Linux'
        run: npm run test:runtime
      - run: npm run test:package
      - uses: actions/upload-artifact@v4
        with:
          name: ade-${{ matrix.os }}
          path: |
            dist/ade-*
            dist/SHA256SUMS-*.txt
          if-no-files-found: error

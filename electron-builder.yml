appId: io.github.takeshibaconsuzuki.ade-overlay
productName: ADE
icon: build/icon.png
directories:
  app: out/release/desktop
  output: dist
artifactName: ade-desktop-${version}-${os}-${arch}.${ext}
files:
  - out/**
  - package.json
asar: true
npmRebuild: false
publish: null
win:
  target: nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.developer-tools
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  extendInfo:
    NSMicrophoneUsageDescription: Allow the editor to use your microphone.
linux:
  category: Development
  maintainer: ADE contributors
  target:
    - AppImage
    - deb
    - rpm

# Copy to server.config.yaml or ~/.ade-overlay/server.config.yaml and configure your projects.
# Relative paths resolve from this configuration file's directory.
host: 0.0.0.0
port: 4317
projects: []
# Example:
# projects:
#   - mainWorktreePath: /path/to/project

# Commands run in the selected worktree on the server host, in a login interactive instance of the user's shell so its profile applies: PowerShell on Windows or $SHELL elsewhere.
# Omitted commands use provider defaults. Reloaded commands apply to new chats.
# chatProviders:
#   codex:
#     command: codex --model your-model

# Uses the server host's standard VS Code extensions and default user settings.
# Extensions are shared; settings sync as whole documents, with the host winning on reconnect.
# Global extension enablement is imported at editor startup; workspace overrides stay local.
# A missing host profile database disables no extensions; an unreadable one prevents editors from starting.
# Override paths for a custom installation or profile. Path changes require a server restart.
# vscode:
#   extensionsDirectory: /path/to/extensions
#   settingsFile: /path/to/User/settings.json
#   profileDatabase: /path/to/User/globalStorage/state.vscdb

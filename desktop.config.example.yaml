# Copy to ~/.ade-overlay/desktop.config.yaml to configure the desktop client. Changes require a
# desktop restart.
# ADE_SERVER_URL overrides serverUrl.
serverUrl: ws://127.0.0.1:4317/rpc

# Optional shell command, continuously rerun in an interactive terminal.
# The picker shows the terminal while disconnected; connection attempts run independently.
# Uses the desktop's working directory and your interactive login shell on macOS/Linux. Keep helpers in the foreground.
# The desktop kills the command's process tree only on connection loss or desktop quit.
# startCommand: ssh -N -o ExitOnForwardFailure=yes -L 4317:127.0.0.1:4317 ade-server
